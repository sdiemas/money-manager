<!-- Splash Screen -->
<div id="splashScreen" class="fixed inset-0 bg-white dark:bg-gray-900 z-[9999] flex flex-col items-center justify-center transition-opacity duration-1000">
  <div class="animate-bounce mb-4">
    <div class="w-16 h-16 bg-gradient-to-r from-blue-500 to-purple-600 rounded-full flex items-center justify-center shadow-lg">
      <i class="fas fa-wallet text-white text-2xl"></i>
    </div>
  </div>
  <h1 class="text-2xl font-bold text-gray-800 dark:text-white mb-2">KeuanganKu</h1>
  <p class="text-sm text-gray-500 dark:text-gray-400">Mengelola keuangan lebih mudah</p>
</div>

<script>
  // Hapus splash screen setelah delay
  window.addEventListener('load', () => {
    setTimeout(() => {
      document.getElementById('splashScreen').style.opacity = '0';
      setTimeout(() => {
        document.getElementById('splashScreen').style.display = 'none';
        window.location.href = "dashboard.html"; 

      }, 1000);
    }, 2000);
  });
</script>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Keuangan Pribadi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }
        .dark .skeleton {
            background: linear-gradient(90deg, #374151 25%, #4b5563 50%, #374151 75%);
            background-size: 200% 100%;
        }
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .slide-in {
            transform: translateX(100%);
            transition: transform 0.3s ease-in-out;
        }
        .slide-in.open {
            transform: translateX(0);
        }
    </style>
</head>
